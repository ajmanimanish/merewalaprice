  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

n><\u002Fbutton>\n          <button onclick=\"{{ goDealerPrices }}\" style=\"border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9A978E\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20.6 12.6L12.6 20.6a2 2 0 01-2.8 0l-8-8A2 2 0 011.2 11V4a2.8 2.8 0 012.8-2.8h7a2 2 0 011.4.6l8 8a2 2 0 010 2.8z\"><\u002Fpath><\u002Fsvg><span style=\"font-size:9.5px;font-weight:600;color:#9A978E;\">Prices<\u002Fspan><\u002Fbutton>\n          <button onclick=\"{{ goDealerRequests }}\" style=\"border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9A978E\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 4h16v12H8l-4 4V4z\"><\u002Fpath><\u002Fsvg><span style=\"font-size:9.5px;font-weight:600;color:#9A978E;\">Requests<\u002Fspan><\u002Fbutton>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 12px;border-radius:11px;background:#FBEEE7;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E4632E\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7\"><\u002Fpath><\u002Fsvg><span style=\"font-size:9.5px;font-weight:800;color:#E4632E;\">Profile<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n\n    <!-- ======================= MODAL: CONTACT SHEET ======================= -->\n    <sc-if value=\"{{ contactModalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;background:rgba(22,21,26,.5);\" onclick=\"{{ closeContact }}\"><\u002Fdiv>\n      <div style=\"position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:20px 22px 30px;\">\n        <div style=\"width:40px;height:4px;border-radius:2px;background:#EAE6DD;margin:0 auto 18px;\"><\u002Fdiv>\n        <div style=\"width:50px;height:50px;border-radius:14px;background:#FBEEE7;display:flex;align-items:center;justify-content:center;margin-bottom:14px;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E4632E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 10V7a4 4 0 018 0v3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"margin:0;font-size:18px;font-weight:800;line-height:1.25;\">Share your number with Sharma Electronics?<\u002Fh3>\n        <p style=\"margin:8px 0 0;font-size:13px;color:#6B6963;font-weight:500;line-height:1.5;\">They'll only use it to confirm this deal. Your number is never shown publicly.<\u002Fp>\n        <button onclick=\"{{ closeContact }}\" style=\"width:100%;height:50px;margin-top:18px;background:#E4632E;color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:14.5px;font-weight:700;\">Yes, share my number<\u002Fbutton>\n        <button onclick=\"{{ closeContact }}\" style=\"width:100%;height:44px;margin-top:8px;background:none;border:none;font-family:inherit;font-size:13px;font-weight:700;color:#6B6963;\">Not now<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ======================= MODAL: SUBMIT OFFER ======================= -->\n    <sc-if value=\"{{ offerModalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;background:rgba(22,21,26,.5);\" onclick=\"{{ closeOffer }}\"><\u002Fdiv>\n      <div style=\"position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:20px 22px 30px;\">\n        <div style=\"width:40px;height:4px;border-radius:2px;background:#EAE6DD;margin:0 auto 18px;\"><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:center;background:#F6F4EF;border-radius:12px;padding:12px;\"><div style=\"width:42px;height:42px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E4632E\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"5\" width=\"20\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M6 15v3M18 15v3M2 10h20\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-size:13px;font-weight:800;\">Blue Star 2 Ton AC<\u002Fdiv><div style=\"font-size:11px;color:#6B6963;\">Budget ₹42,000 · Arera Colony<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <label style=\"font-size:12.5px;font-weight:700;display:block;margin-top:16px;\">Your price for this request<\u002Flabel>\n        <div style=\"background:#F6F4EF;border:1.5px solid #E4632E;border-radius:12px;padding:14px;margin-top:8px;display:flex;align-items:center;gap:5px;\"><span style=\"font-size:17px;font-weight:800;color:#6B6963;\">₹<\u002Fspan><span style=\"font-size:19px;font-weight:800;\">41,500<\u002Fspan><\u002Fdiv>\n        <label style=\"font-size:12.5px;font-weight:700;display:block;margin-top:14px;\">Availability<\u002Flabel>\n        <div style=\"display:flex;gap:8px;margin-top:8px;\"><span style=\"flex:1;text-align:center;background:#E4632E;color:#fff;font-size:12px;font-weight:700;padding:10px;border-radius:10px;\">Today<\u002Fspan><span style=\"flex:1;text-align:center;background:#F6F4EF;border:1px solid #EAE6DD;font-size:12px;font-weight:600;padding:10px;border-radius:10px;\">1–2 days<\u002Fspan><\u002Fdiv>\n        <button onclick=\"{{ closeOffer }}\" style=\"width:100%;height:50px;margin-top:18px;background:#E4632E;color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:14.5px;font-weight:700;\">Submit offer<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <div style=\"max-width:390px;margin-top:20px;background:#fff;border:1px solid #EAE6DD;border-radius:14px;padding:12px 16px;text-align:center;font-size:12px;font-weight:700;color:#6B6963;\">{{ screenLabel }}<\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    flow: 'buyer',\n    buyerScreen: 'onboarding',\n    dealerScreen: 'login',\n    contactModalOpen: false,\n    offerModalOpen: false,\n  };\n\n  setBuyerFlow = () => this.setState({ flow: 'buyer' });\n  setDealerFlow = () => this.setState({ flow: 'dealer' });\n\n  goHome = () => this.setState({ buyerScreen: 'home' });\n  goSearch = () => this.setState({ buyerScreen: 'search' });\n  goCategory = () => this.setState({ buyerScreen: 'category' });\n  goProduct = () => this.setState({ buyerScreen: 'product' });\n  goRequest = () => this.setState({ buyerScreen: 'request' });\n  goLogin = () => this.setState({ buyerScreen: 'login' });\n  goProfile = () => this.setState({ buyerScreen: 'profile' });\n  goFavourites = () => this.setState({ buyerScreen: 'favourites' });\n\n  goDealerDashboard = () => this.setState({ dealerScreen: 'dashboard' });\n  goDealerPrices = () => this.setState({ dealerScreen: 'prices' });\n  goDealerRequests = () => this.setState({ dealerScreen: 'requests' });\n  goDealerWon = () => this.setState({ dealerScreen: 'won' });\n  goDealerProfile = () => this.setState({ dealerScreen: 'profile' });\n  goDealerLoginReset = () => this.setState({ dealerScreen: 'login' });\n\n  openContact = () => this.setState({ contactModalOpen: true });\n  closeContact = () => this.setState({ contactModalOpen: false });\n  openOffer = () => this.setState({ offerModalOpen: true });\n  closeOffer = () => this.setState({ offerModalOpen: false });\n\n  renderVals() {\n    const s = this.state;\n    const isBuyer = s.flow === 'buyer';\n    const isDealer = s.flow === 'dealer';\n\n    const dealerLabels = {\n      login: 'Dealer · Sign in',\n      dashboard: 'Dealer · Dashboard',\n      prices: 'Dealer · Price manager',\n      requests: 'Dealer · Special requests',\n      won: 'Dealer · Won deals',\n      profile: 'Dealer · Profile & settings',\n    };\n    const buyerLabels = {\n      onboarding: 'Buyer · Onboarding',\n      home: 'Buyer · Home / Browse',\n      search: 'Buyer · Search results',\n      category: 'Buyer · Category browse',\n      product: 'Buyer · Product detail & compare',\n      request: 'Buyer · Special request form',\n      login: 'Buyer · Sign in',\n      profile: 'Buyer · Profile',\n      favourites: 'Buyer · Saved & requests',\n    };\n\n    const darkStatus = isDealer && (s.dealerScreen === 'login' || s.dealerScreen === 'dashboard');\n\n    return {\n      isBuyer,\n      isDealer,\n      buyerTabBg: isBuyer ? '#E4632E' : 'transparent',\n      buyerTabColor: isBuyer ? '#fff' : '#6B6963',\n      dealerTabBg: isDealer ? '#16151A' : 'transparent',\n      dealerTabColor: isDealer ? '#fff' : '#6B6963',\n      statusBarBg: darkStatus ? '#16151A' : (isDealer ? '#FDFCFA' : (s.buyerScreen === 'product' ? '#fff' : '#FDFCFA')),\n      statusBarFg: darkStatus ? '#fff' : '#16151A',\n\n      isOnboarding: isBuyer && s.buyerScreen === 'onboarding',\n      isHome: isBuyer && s.buyerScreen === 'home',\n      isSearch: isBuyer && s.buyerScreen === 'search',\n      isCategory: isBuyer && s.buyerScreen === 'category',\n      isProduct: isBuyer && s.buyerScreen === 'product',\n      isRequest: isBuyer && s.buyerScreen === 'request',\n      isLogin: isBuyer && s.buyerScreen === 'login',\n      isProfile: isBuyer && s.buyerScreen === 'profile',\n      isFavourites: isBuyer && s.buyerScreen === 'favourites',\n\n      isDealerLogin: isDealer && s.dealerScreen === 'login',\n      isDealerDashboard: isDealer && s.dealerScreen === 'dashboard',\n      isDealerPrices: isDealer && s.dealerScreen === 'prices',\n      isDealerRequests: isDealer && s.dealerScreen === 'requests',\n      isDealerWon: isDealer && s.dealerScreen === 'won',\n      isDealerProfile: isDealer && s.dealerScreen === 'profile',\n\n      contactModalOpen: s.contactModalOpen,\n      offerModalOpen: s.offerModalOpen,\n\n      screenLabel: isBuyer ? (buyerLabels[s.buyerScreen] || '') : (dealerLabels[s.dealerScreen] || ''),\n\n      setBuyerFlow: this.setBuyerFlow,\n      setDealerFlow: this.setDealerFlow,\n      goHome: this.goHome,\n      goSearch: this.goSearch,\n      goCategory: this.goCategory,\n      goProduct: this.goProduct,\n      goRequest: this.goRequest,\n      goLogin: this.goLogin,\n      goProfile: this.goProfile,\n      goFavourites: this.goFavourites,\n      goDealerDashboard: this.goDealerDashboard,\n      goDealerPrices: this.goDealerPrices,\n      goDealerRequests: this.goDealerRequests,\n      goDealerWon: this.goDealerWon,\n      goDealerProfile: this.goDealerProfile,\n      goDealerLoginReset: this.goDealerLoginReset,\n      openContact: this.openContact,\n      closeContact: this.closeContact,\n      openOffer: this.openOffer,\n      closeOffer: this.closeOffer,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
